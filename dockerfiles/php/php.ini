; PHP production hardening for Laravel / PHP-FPM container
; The application path is supplied dynamically by Docker Compose.
;
; Notes:
; - This is production-oriented.
; - For local development, set display_errors=On and opcache.validate_timestamps=1.
; - If your app uses SSO or cross-site redirects, consider changing SameSite from Strict to Lax.
; - If your app uses Symfony Process, queue jobs that run shell commands, or PDF/image tools,
;   proc_open/exec/shell_exec may need to be removed from disable_functions.

[PHP]

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Basic security
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

expose_php = Off
short_open_tag = Off
enable_dl = Off

; Do not expose errors to users
display_errors = Off
display_startup_errors = Off

; Log errors instead
log_errors = On
error_log = /var/log/php/error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Safer exception output in production
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Resource limits
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

max_execution_time = 300
max_input_time = 300
memory_limit = 512M
max_input_vars = 3000

; Upload limits
file_uploads = On
upload_max_filesize = 20M
max_file_uploads = 10
post_max_size = 25M

; Request / socket behavior
default_socket_timeout = 60

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Dangerous functions
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; WARNING:
; These improve hardening but can break features that need shell/process execution.
; Common Laravel web requests are usually okay.
; Composer/npm/artisan containers should not rely on this php.ini if they need proc_open.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,phpinfo

disable_classes =

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Filesystem restrictions
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Allow the dynamically selected application under /var/www/html plus temp and logs.
; If you need access to another mounted directory, add it here separated by colon.
open_basedir = /var/www/html:/tmp:/var/log/php

; Remote file wrappers
; Keep allow_url_include Off always.
; allow_url_fopen Off is safer, but can break apps that use fopen() for HTTP URLs.
allow_url_fopen = Off
allow_url_include = Off

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Sessions
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

session.save_handler = files
session.save_path = "/tmp"

session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.auto_start = 0

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.cookie_lifetime = 0
session.cookie_path = /

session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

session.sid_length = 48
session.sid_bits_per_character = 6

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Data handling
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On

default_mimetype = "text/html"
default_charset = "UTF-8"

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Output
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

output_buffering = 4096
implicit_flush = Off
zlib.output_compression = Off

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; OPcache production settings
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Production: 0 means PHP will not check file changes.
; After deployment, restart php-fpm/container.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

opcache.save_comments = 1
opcache.fast_shutdown = 1

; Recommended safety/performance defaults
opcache.max_wasted_percentage = 5
opcache.use_cwd = 1
opcache.revalidate_path = 0
opcache.enable_file_override = 0
opcache.consistency_checks = 0
opcache.file_update_protection = 2

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Assertions
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

zend.assertions = -1
assert.active = Off

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; MySQL / PostgreSQL
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

mysqli.allow_persistent = Off
pgsql.allow_persistent = Off

pgsql.ignore_notice = 0
pgsql.log_notice = 0

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Mail
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

mail.add_x_header = Off

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; SOAP
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

soap.wsdl_cache_enabled = 1
soap.wsdl_cache_dir = "/tmp"
soap.wsdl_cache_ttl = 86400
soap.wsdl_cache_limit = 5

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; FFI
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

ffi.enable = false
